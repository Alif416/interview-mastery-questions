<!doctype html>

    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('im-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Counterpart to public/404.html's spa-github-pages redirect: restore the
      // real path (and query/hash) from the ?p=... encoding before React Router mounts.
      (function () {
        var l = window.location;
        if (l.search[1] === 'p' && l.search[2] === '=') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) +
              decoded[0].slice(2) +
              (decoded[1] ? '?' + decoded[1].slice(2) : '') +
              l.hash
          );
        }
      })();
    </script>
