<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Interview Mastery</title>
    <script>
      // GitHub Pages SPA fallback (https://github.com/rafgraph/spa-github-pages).
      // GitHub Pages serves this for any path with no matching file — encode the
      // real path into a query string and redirect to index.html, which decodes
      // it back via the inline script there before React Router mounts.
      var pathSegmentsToKeep = 1; // keep "/interview-mastery-questions"
      var l = window.location;
      var redirectUrl =
        l.protocol +
        '//' +
        l.hostname +
        (l.port ? ':' + l.port : '') +
        l.pathname
          .split('/')
          .slice(0, 1 + pathSegmentsToKeep)
          .join('/') +
        '/?p=/' +
        l.pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body></body>
</html>
