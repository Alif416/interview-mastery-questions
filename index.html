      } catch (e) {}

  <script>
    (function () {
      var STORAGE_KEY = 'im-theme';
      var root = document.documentElement;
      var mql = window.matchMedia('(prefers-color-scheme: dark)');

      var MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>';
      var SUN = '<circle cx="12" cy="12" r="5"></circle>' +
        '<line x1="12" y1="1" x2="12" y2="3"></line>' +
        '<line x1="12" y1="21" x2="12" y2="23"></line>' +
        '<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>' +
        '<line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>' +
        '<line x1="1" y1="12" x2="3" y2="12"></line>' +
        '<line x1="21" y1="12" x2="23" y2="12"></line>' +
        '<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>' +
        '<line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';

      function getEffectiveTheme() {
        var explicit = root.getAttribute('data-theme');
        if (explicit === 'light' || explicit === 'dark') { return explicit; }
        return mql.matches ? 'dark' : 'light';
      }

      function render() {
        var btn = document.getElementById('theme-toggle');
        var icon = document.getElementById('theme-icon');
        if (!btn || !icon) { return; }
        var effective = getEffectiveTheme();
        icon.innerHTML = effective === 'dark' ? SUN : MOON;
        btn.setAttribute('aria-label', effective === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
      }

      function setTheme(theme) {
        root.setAttribute('data-theme', theme);
        try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
        render();
      }

      render();
      document.getElementById('theme-toggle').addEventListener('click', function () {
        setTheme(getEffectiveTheme() === 'dark' ? 'light' : 'dark');
      });
      mql.addEventListener('change', function () {
        if (!root.getAttribute('data-theme')) { render(); }
      });
    })();
  </script>
</body>
